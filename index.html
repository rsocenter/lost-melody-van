  <style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; text-align:center; margin:0; padding:0; }
    img.poster { max-width:min(92vw,520px); max-height:42vh; margin-top:10px; object-fit:contain; border-radius:22px; }
    .controls,.song-buttons { margin:10px auto; display:flex; justify-content:center; flex-wrap:wrap; gap:10px; padding:0 10px; }
    .controls button,.email-btn { padding:8px 16px; border-radius:8px; border:1px solid white; background:transparent; color:white; cursor:pointer; text-decoration:none; }
    .controls button.active { background:#ffd43b; color:#000; box-shadow:0 0 14px rgba(255,212,59,.55); }
    .song-buttons button { padding:7px 12px; border-radius:8px; border:none; background:#444; color:white; cursor:pointer; }
    .song-buttons button.active { background:#ffd43b; color:#000; box-shadow:0 0 16px rgba(255,212,59,.75); animation:isaskaPulse 1.8s ease-in-out infinite; }
    @keyframes isaskaPulse { 0%,100% { transform:scale(1); box-shadow:0 0 10px rgba(255,212,59,.45); } 50% { transform:scale(1.035); box-shadow:0 0 22px rgba(255,212,59,.9); } }
    .note-yellow { color:#ffd43b; text-shadow:0 0 10px rgba(255,212,59,.7); }
    #current-song { font-weight:bold; margin:10px 0 2px; padding:0 10px; }
    .artist-line { color:#ffd43b; font-size:14px; font-weight:700; margin:0 0 8px; }
    .footer-rights { margin:22px auto 12px; padding:0 14px; max-width:720px; color:#bbb; font-size:12px; line-height:1.5; }
    audio { margin:10px auto; width:min(90%,700px); display:block; }
    #updateNotice { display:none; position:sticky; top:0; z-index:99; margin:0 auto 8px; padding:10px 12px; background:#ffd43b; color:#000; font-weight:700; box-shadow:0 0 18px rgba(255,212,59,.45); }
    #updateNotice button { margin-left:10px; padding:6px 10px; border:0; border-radius:8px; background:#000; color:#ffd43b; font-weight:700; }
    h1 .note-yellow { animation:isaskaNotePulse 1.8s ease-in-out infinite; display:inline-block; }
    @keyframes isaskaNotePulse { 0%,100% { opacity:.75; transform:scale(1); } 50% { opacity:1; transform:scale(1.12); text-shadow:0 0 18px rgba(255,212,59,.95); } }
  </style>

  <h1>ISASKA <span class="note-yellow">♫♪</span></h1>
  <div class="controls">
    <button class="active" id="sequential">▶️ Sorban</button>
    <button id="shuffle">🔀 Véletlen</button>
    <button id="installApp">📲 App telepítése</button>
  </div>
  <div class="song-buttons" id="song-list"></div>
  <div id="current-song"><span class="note-yellow">♫</span> Jelenleg nincs lejátszott dal</div>
  <div class="artist-line">Előadó: ISASKA</div>
  <audio controls id="player" preload="metadata"></audio>
  <div class="controls">
    <button onclick="shareApp()">📤 App megosztása</button>
    <a class="email-btn" href="mailto:kovacsisa05@gmail.com?subject=ISASKA kapcsolat">📧 Írj nekünk</a>
  </div>
<div class="footer-rights">© ISASKA 2026 · Official ISASKA release · Unauthorized reupload is not permitted.</div>
<script>
const ARTIST_NAME = "ISASKA";
const tracks = [
  {
    "title": "Soy libre",
    "artist": "ISASKA",
    "src": "01-soy-libre.mp3"
  },
  {
    "title": "Soy libre pepperapabum",
    "artist": "ISASKA",
    "src": "02-soy-libre-pepperapabum.mp3"
  },
  {
    "title": "Nem veszem be",
    "artist": "ISASKA",
    "src": "03-nem-veszem-be.mp3"
  },
  {
    "title": "Csak nosztalgia",
    "artist": "ISASKA",
    "src": "04-csak-nosztalgia.mp3"
  },
  {
    "title": "Nosztalgia",
    "artist": "ISASKA",
    "src": "05-nosztalgia.mp3"
  },
  {
    "title": "Baila baby",
    "artist": "ISASKA",
    "src": "06-baila-baby.mp3"
  },
  {
    "title": "Őrült nyár",
    "artist": "ISASKA",
    "src": "07-orult-nyar.mp3"
  },
  {
    "title": "Ááhe",
    "artist": "ISASKA",
    "src": "08-aahe.mp3"
  },
  {
    "title": "Fortuna kisasszony",
    "artist": "ISASKA",
    "src": "09-fortuna-kisasszony.mp3"
  },
  {
    "title": "Szerencse kisasszony",
    "artist": "ISASKA",
    "src": "10-szerencse-kisasszony.mp3"
  },
  {
    "title": "Csókolózni egyedül",
    "artist": "ISASKA",
    "src": "11-csokolozni-egyedul.mp3"
  },
  {
    "title": "Rabotaty",
    "artist": "ISASKA",
    "src": "12-rabotaty.mp3"
  },
  {
    "title": "Tánc",
    "artist": "ISASKA",
    "src": "13-tanc.mp3"
  },
  {
    "title": "Mimi a mini hippie",
    "artist": "ISASKA",
    "src": "14-mimi-a-mini-hippie.mp3"
  },
  {
    "title": "Kutyaszorító",
    "artist": "ISASKA",
    "src": "15-kutyaszorito.mp3"
  }
];
const player = document.getElementById('player');
const songList = document.getElementById('song-list');
const currentText = document.getElementById('current-song');
let currentIndex = 0;
let mode = 'sequential';

tracks.forEach((track, index) => {
  const btn = document.createElement('button');
  btn.textContent = `${index + 1}. ${track.title}`;
  btn.onclick = () => playSong(index);
  songList.appendChild(btn);
});

function playSong(index) {
  currentIndex = index;
  player.src = tracks[index].src;
  player.play().catch(() => {
    currentText.textContent = '♫ Válaszd ki újra a dalt, a böngésző engedélyt kérhet a lejátszáshoz.';
  });
  highlightPlaying(index);
  currentText.textContent = '♫ Most szól: ' + tracks[index].title + ' – ' + (tracks[index].artist || ARTIST_NAME);
}
function highlightPlaying(index) {
  document.querySelectorAll('#song-list button').forEach(btn => btn.classList.remove('active'));
  const btn = document.querySelectorAll('#song-list button')[index];
  if (btn) btn.classList.add('active');
}
document.getElementById('sequential').onclick = () => { mode='sequential'; setActiveMode('sequential'); };
document.getElementById('shuffle').onclick = () => { mode='shuffle'; setActiveMode('shuffle'); };
function setActiveMode(id) {
  document.getElementById('sequential').classList.remove('active');
  document.getElementById('shuffle').classList.remove('active');
  document.getElementById(id).classList.add('active');
}
player.addEventListener('ended', () => {
  playSong(mode === 'shuffle' ? Math.floor(Math.random() * tracks.length) : (currentIndex + 1) % tracks.length);
});
function shareApp() {
  if (navigator.share) navigator.share({title:'ISASKA', text:'Hallgasd meg az ISASKA hivatalos dalait!', url:window.location.href}).catch(()=>{});
  else alert('A böngésződ nem támogatja az app megosztást.');
}
const APP_VERSION = 'v22';
const TRACK_COUNT = tracks.length;
const prevCount = parseInt(localStorage.getItem('isaskaTrackCount') || '0', 10);
if (prevCount && TRACK_COUNT > prevCount) {
  const diff = TRACK_COUNT - prevCount;
  const n = document.getElementById('updateNotice');
  n.innerHTML = `${diff} új szám elérhető az ISASKÁ-ban 🎵 <button onclick="localStorage.setItem('isaskaTrackCount', TRACK_COUNT); location.reload()">Frissítés</button>`;
  n.style.display = 'block';
}
localStorage.setItem('isaskaTrackCount', TRACK_COUNT);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js?v=22').then(reg => {
    reg.update();
    reg.addEventListener('updatefound', () => {
      const worker = reg.installing;
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('updateNotice').style.display = 'block';
        }
      });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => { /* új worker aktív */ });
}
let deferredPrompt;
const installBtn = document.getElementById('installApp');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt=e; installBtn.style.display='inline-block'; });
installBtn.addEventListener('click', () => { if (deferredPrompt) deferredPrompt.prompt(); });
</script>
